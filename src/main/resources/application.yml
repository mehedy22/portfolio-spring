server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: portfolio-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Outer guard only. The per-type limits under app.media are the ones that produce the
      # documented 400 VALIDATION_ERROR; this stops a multi-gigabyte body from being buffered
      # at all, and is deliberately set above the largest per-type limit.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:12MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:14MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  jwt:
    # No default, deliberately: a committed fallback secret that "works" would let anyone who
    # reads this repo forge admin tokens, and a forgotten JWT_SECRET would fail silently instead
    # of loudly. Unset => startup fails with instructions (see JwtSecretValidator).
    # Local development: run with --spring.profiles.active=dev (application-dev.yml).
    secret: ${JWT_SECRET:OrmZGK+OU6UTpyb3+NgB1eMLKYwKcdl+SEEp5fxAIx0ZGwdZO72v00OQmbKctxyt}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

  auth:
    login-rate-limit:
      # One account exists, so a successful brute-force is total compromise — kept deliberately tight.
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
    cookie:
      # false for local http development; set true in production (HTTPS is a hard prerequisite).
      secure: ${COOKIE_SECURE:false}
    bootstrap:
      # Provisions the single admin on first start when no admin row exists. No defaults by design.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

  media:
    # NFR-06 / D-018. Externalized: widening the limit is an env-var change, not a release.
    max-image-size: ${MEDIA_MAX_IMAGE_SIZE:5MB}
    max-document-size: ${MEDIA_MAX_DOCUMENT_SIZE:10MB}
    # LOCAL storage backend root. Production swaps in an object-storage backend instead
    # (OPEN_QUESTIONS.md #11) — no caller changes when it does.
    storage-root: ${MEDIA_STORAGE_ROOT:./data/media}

  contact:
    rate-limit:
      # docs/08-security/application-security.md's rate-limit table: 5 / IP / hour.
      max-attempts: ${CONTACT_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${CONTACT_RATE_LIMIT_WINDOW:1h}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
